<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFC700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#1a1a1a"/>
  
  <!-- Letter L -->
  <text x="45" y="155" font-family="Georgia, serif" font-size="140" font-weight="bold" fill="url(#goldGradient)" letter-spacing="-8">L</text>
  
  <!-- Letter B -->
  <text x="85" y="155" font-family="Georgia, serif" font-size="140" font-weight="bold" fill="url(#goldGradient)" letter-spacing="-8">B</text>
</svg>